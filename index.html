<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Warmline is an accessibility-first calling concierge: say what you need in any language, approve the plan, and it makes the call for you."
    />
    <meta name="theme-color" content="#fbf8f1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>Warmline</title>
    <!-- Apply a remembered dark choice BEFORE first paint. Warmline defaults to
         its warm cream design for everyone, so the only thing this prevents is
         a cream flash for someone who has deliberately chosen dark. Kept inline
         and tiny on purpose: it has to run before the stylesheet paints. -->
    <script>
      try {
        if (localStorage.getItem("warmline-theme") === "dark") {
          document.documentElement.dataset.theme = "dark";
        }
      } catch (e) {
        /* Private mode with storage blocked: stay on the cream default. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
